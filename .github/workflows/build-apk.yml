name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Build radare2 for arm64 and package libr2.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-r2-android.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: r2-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish installable APK to the latest release
        # Manual only: run the workflow with 'Run workflow' to publish the installable APK.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk r2-mobile.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk r2-mobile.apk \
            --target "$GITHUB_SHA" \
            --title "R2 Mobile latest build" \
            --notes "Built from commit $GITHUB_SHA. Download r2-mobile.apk and install it directly, no unzip needed."
